name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Acceptance tests
        run: python3 -m unittest discover -s tests -v
      - name: actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt \
            -o /tmp/actionlint-checksums.txt
          (cd /tmp && grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint-checksums.txt | sed 's/  */  /' > actionlint.sha256)
          mv /tmp/actionlint.tar.gz /tmp/actionlint_1.7.7_linux_amd64.tar.gz
          (cd /tmp && sha256sum -c actionlint.sha256)
          tar -xzf /tmp/actionlint_1.7.7_linux_amd64.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Shell syntax
        run: bash -n scripts/deploy.sh scripts/deploy-ssh.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build; publish only on main
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ima-jin/postal-deploy:${{ github.sha }}
            ghcr.io/ima-jin/postal-deploy:main
