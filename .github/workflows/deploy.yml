name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize the entire dev -> approval -> production sequence. Never interrupt
# a deployment halfway through replacing services or rolling back.
concurrency:
  group: postal-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: dev
    runs-on: ${{ vars.POSTAL_DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy dev
        env:
          POSTAL_IMAGE: ghcr.io/ima-jin/postal-deploy:${{ github.event.workflow_run.head_sha }}
          POSTAL_HOST: ${{ vars.POSTAL_HOST }}
          POSTAL_USER: ${{ vars.POSTAL_USER }}
          POSTAL_PORT: ${{ vars.POSTAL_PORT }}
          POSTAL_COMPOSE_DIR: ${{ vars.POSTAL_COMPOSE_DIR }}
          POSTAL_SERVICES: ${{ vars.POSTAL_SERVICES }}
          POSTAL_HEALTH_URL: ${{ vars.POSTAL_HEALTH_URL }}
          POSTAL_DEPLOY_SSH_KEY: ${{ secrets.POSTAL_DEPLOY_SSH_KEY }}
          POSTAL_SSH_KNOWN_HOSTS: ${{ secrets.POSTAL_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh.sh

  deploy-prod:
    needs: deploy-dev
    environment: production
    runs-on: ${{ vars.POSTAL_DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy production (environment approval required)
        env:
          POSTAL_IMAGE: ghcr.io/ima-jin/postal-deploy:${{ github.event.workflow_run.head_sha }}
          POSTAL_HOST: ${{ vars.POSTAL_HOST }}
          POSTAL_USER: ${{ vars.POSTAL_USER }}
          POSTAL_PORT: ${{ vars.POSTAL_PORT }}
          POSTAL_COMPOSE_DIR: ${{ vars.POSTAL_COMPOSE_DIR }}
          POSTAL_SERVICES: ${{ vars.POSTAL_SERVICES }}
          POSTAL_HEALTH_URL: ${{ vars.POSTAL_HEALTH_URL }}
          POSTAL_DEPLOY_SSH_KEY: ${{ secrets.POSTAL_DEPLOY_SSH_KEY }}
          POSTAL_SSH_KNOWN_HOSTS: ${{ secrets.POSTAL_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh.sh
